name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: detect
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/detect

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ci

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic detect-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/detect"

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/detect-service api="$IMAGE"
          kubectl rollout status deploy/detect-service --timeout=120s

      - name: smoke
        run: |
          kubectl port-forward svc/detect-service 8080:80 &
          sleep 5

          curl --fail -s localhost:8080/health
          echo

          curl --fail -s -X POST localhost:8080/v1/predict \
            -H "Content-Type: application/json" \
            -d @good.json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert 0 <= r['score'] <= 1, r"

          sleep 2

          kubectl exec deploy/postgres -- psql -U postgres -d detect \
            -tc "SELECT count(*) FROM predictions" | grep -q 1
      - name: диагностика
        if: failure()
        run: |
          echo "=== PODS ==="
          kubectl get pods -o wide

          echo "=== EVENTS ==="
          kubectl get events --sort-by=.lastTimestamp | tail -50

          echo "=== DEPLOYMENT ==="
          kubectl describe deployment/detect-service | tail -80

          echo "=== POD DIAGNOSTICS ==="
          for pod in $(kubectl get pods -l app=detect -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== POD: $pod ==="
            kubectl describe pod "$pod" | tail -100 || true
            echo "--- current logs ---"
            kubectl logs "$pod" --all-containers=true --tail=50 || true
            echo "--- previous logs ---"
            kubectl logs "$pod" --all-containers=true --previous --tail=50 || true
          done